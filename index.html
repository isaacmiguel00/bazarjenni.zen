@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

</style></head><body>
<nav id="nav"></nav><main></main><div id="toast"></div>
<script>
// ---------- Datos (se guardan solos en el navegador con cada cambio) ----------
const K='bazarpos';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{p:[],s:[],c:[],v:[],a:[],m:[],k:[],n:1};db.b=db.b||[];
db.p.forEach(p=>{(p.cb||[]).forEach(c=>db.b.push({id:db.n++,n:p.n+' ×'+c.q,pr:c.pr,items:[{id:p.id,q:c.q}]}));delete p.cb});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('No se pudo guardar. Haz un respaldo ya.')}};
const id=()=>db.n++,$=s=>document.querySelector(s),now=()=>new Date().toISOString();
const money=n=>'$'+(+n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=i=>db.p.find(x=>x.id==i),nm=(l,i)=>(db[l].find(x=>x.id==i)||{}).n||'';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2000)};
const opts=(l,sel,ph)=>`<option value="">${ph}</option>`+db[l].map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.n)}</option>`).join('');
const ymd=s=>new Date(s).toLocaleDateString('sv'),fh=s=>new Date(s).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
async function down(name,txt,type){const f=new File([txt],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name=='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}

// ---------- Iconos (SVG propios, funcionan sin internet) ----------
const IC={caja:'<path d="M3 4h2l2 10h11l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',
truck:'<path d="M2 6h11v10H2zM13 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M19 14c2 1 3 3 3 6"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-3"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',cam:'<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
save:'<path d="M5 3h12l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;

// ---------- Navegación ----------
const TABS=[['caja','Caja','caja'],['inv','Inventario','box'],['pro','Proveedores','truck'],['cli','Clientes','users'],['apa','Apartados','clock'],['ven','Ventas','chart'],['cor','Corte','cash'],['res','Respaldo','save']];
let tab='caja',gt;
function go(t){const ch=t!=tab;tab=t;$('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${ic(x[2])}${x[1]}</button>`).join('')+themeSel();const m=$('main');V[t]();if(ch){m.classList.remove('fi');void m.offsetWidth;m.classList.add('fi')}}
const V={};

// ---------- CAJA ----------
let cart=[],qs='',rec='',cust='';
const B=i=>db.b.find(x=>x.id==i),bAv=b=>Math.min(...b.items.map(x=>{const p=P(x.id);return p?Math.floor(p.sk/x.q):0})),bOk=b=>b.items.length&&bAv(b)>0;
const cl=l=>l.k=='b'?B(l.id):P(l.id),adj=(l,n)=>(l.c||[{id:l.id,q:l.u||1}]).forEach(x=>{const p=P(x.id);if(p)p.sk+=n*x.q});
const tot=()=>cart.reduce((a,l)=>a+l.q*cl(l).pr,0);
const need=()=>{const m={};cart.forEach(l=>(l.k=='b'?B(l.id).items:[{id:l.id,q:1}]).forEach(x=>m[x.id]=(m[x.id]||0)+x.q*l.q));return m},fits=()=>Object.entries(need()).every(([i,q])=>{const p=P(i);return p&&q<=p.sk});
V.caja=()=>{$('main').innerHTML=`<div class="pos"><section><div style="display:flex;gap:6px"><input id="q" style="flex:1" placeholder="Buscar producto o escanear código y presionar Enter" value="${esc(qs)}" oninput="qs=this.value;clearTimeout(gt);gt=setTimeout(grid,90)" onkeydown="if(event.key=='Enter')scan()"><button onclick="camCaja()" title="Escanear con cámara">${ic('cam')}</button></div><div id="g" class="grid"></div></section><aside><h3>Venta actual</h3><div id="ct"></div></aside><button id="fab" class="pri" onclick="$('aside').scrollIntoView({behavior:'smooth'})"></button></div>`;grid();cartV();$('#q').focus()};
function grid(){const s=qs.toLowerCase(),bs=db.b.filter(b=>bOk(b)&&(!s||b.n.toLowerCase().includes(s))).map(b=>`<button class="card cb" onclick="add('b',${b.id})"><b>${esc(b.n)}</b><span>${money(b.pr)}</span><small>Combo · ${bAv(b)} disponibles</small></button>`),
 ps=db.p.filter(p=>p.sk>0&&(!s||p.n.toLowerCase().includes(s)||(p.cd&&nz(p.cd)==nz(qs)))).slice(0,150).map(p=>`<button class="card" onclick="add('p',${p.id})"><b>${esc(p.n)}</b><span>${money(p.pr)}</span><small>${p.sk} disponibles</small></button>`);
 $('#g').innerHTML=[...bs,...ps].join('')||'<p class="m">No hay productos disponibles. Agrégalos en Inventario.</p>'}
function scan(){const p=byCode(qs);if(p&&p.sk>0){add('p',p.id);qs='';$('#q').value='';grid()}}
function add(k,i){const l=cart.find(x=>x.k==k&&x.id==i);l?l.q++:cart.push({k,id:i,q:1});if(!fits()){l?l.q--:cart.pop();return toast('No hay más stock')}cartV()}
function chg(k,i,d){const l=cart.find(x=>x.k==k&&x.id==i);l.q+=d;if(d>0&&!fits()){l.q-=d;toast('No hay más stock')}if(l.q<1)cart=cart.filter(x=>x!=l);cartV()}
function cartV(){cart=cart.filter(cl);$('#ct').innerHTML=(cart.map(l=>{const p=cl(l);return`<div class="ln"><span>${l.k=='b'?'Combo: ':''}${esc(p.n)}</span><span><button onclick="chg('${l.k}',${l.id},-1)">−</button> ${l.q} <button onclick="chg('${l.k}',${l.id},1)">+</button></span><b>${money(l.q*p.pr)}</b></div>`}).join('')||'<p class="m">Toca un producto para agregarlo.</p>')+
`<h2 class="big">Total ${money(tot())}</h2><select onchange="cust=this.value">${opts('c',cust,'Cliente (opcional)')}</select><input type="number" min="0" placeholder="Recibido o anticipo" value="${rec}" oninput="rec=this.value;chgV()"><p id="cg" class="m"></p><div class="row"><button class="pri" onclick="pay()">Cobrar</button><button onclick="lay()">Apartar</button><button onclick="vac()">Vaciar</button></div>`;chgV()}
function chgV(){const t=tot(),r=$('#cg'),f=$('#fab');if(f)f.textContent='Venta '+money(t)+' · '+cart.reduce((a,l)=>a+l.q,0)+' pzas';if(r)r.textContent=rec!==''&&+rec>=t&&t>0?'Cambio: '+money(rec-t):''}
function take(){return cart.map(l=>{const e=cl(l),it=l.k=='b'?{id:e.id,n:'Combo: '+e.n,pr:e.pr,q:l.q,c:e.items.map(x=>({id:x.id,q:x.q}))}:{id:e.id,n:e.n,pr:e.pr,q:l.q};adj(it,-l.q);return it})}
async function pay(){if(!cart.length)return;const t=tot(),r=rec===''?t:+rec;if(r<t)return toast('Lo recibido es menor al total');
 if(!await ask('¿Cobrar <b>'+money(t)+'</b>?'+(r>t?'<br>Cambio: '+money(r-t):''),'Cobrar'))return;
 const s={id:id(),d:now(),items:take(),t,cl:cust,st:'ok'};db.v.push(s);db.m.push({id:id(),d:s.d,ty:'venta',a:t});save();

async function abono(i){const a=db.a.find(x=>x.id==i),r=await form('Abonar (resta '+money(a.t-a.pd)+')',[{l:'Monto',t:'number',v:''}]);if(!r)return;const v=+r[0];if(!(v>0)||v>a.t-a.pd)return toast('Monto no válido');if(!await ask('¿Registrar abono de '+money(v)+'?'))return;a.pd+=v;db.m.push({id:id(),d:now(),ty:'abono',a:v});save();V.apa()}

 a.items.forEach(l=>adj(l,l.q));if(a.pd)db.m.push({id:id(),d:now(),ty:'cancel',a:-a.pd});a.st='cancelado';save();V.apa()}

let per='day',fd=ymd(now());
const inR=s=>{const d=new Date(s.d),l=ymd(s.d),d0=new Date(fd+'T00:00');
 if(per=='day')return l==fd;if(per=='month')return l.slice(0,7)==fd.slice(0,7);
 if(per=='week'){const st=new Date(d0);st.setDate(st.getDate()-(d0.getDay()+6)%7);const en=new Date(st);en.setDate(en.getDate()+7);return d>=st&&d<en}return true};
V.ven=()=>{const L=db.v.filter(inR),ok=L.filter(s=>s.st=='ok'),T=ok.reduce((a,s)=>a+s.t,0),U=ok.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.q*(i.u||1),0),0);
 $('main').innerHTML=`<div class="bar"><select onchange="per=this.value;V.ven()">${[['day','Día'],['week','Semana (lun–dom)'],['month','Mes'],['all','Todo']].map(x=>`<option value="${x[0]}" ${x[0]==per?'selected':''}>${x[1]}</option>`).join('')}</select><input type="date" value="${fd}" onchange="fd=this.value||fd;V.ven()"><button class="pri" onclick="csv()">${ic('save')} Exportar a Excel (CSV)</button></div>
 <div class="box"><span class="big">${money(T)}</span> <span class="m">· ${ok.length} ventas · ${U} piezas${L.length-ok.length?' · '+(L.length-ok.length)+' canceladas':''}</span></div>
 <div class="wrap"><table><tr><th>Folio</th><th>Fecha</th><th>Productos</th><th>Cliente</th><th>Total</th><th></th></tr>`+[...L].reverse().map(s=>`<tr style="${s.st!='ok'?'opacity:.5;text-decoration:line-through':''}"><td>${s.id}</td><td>${fh(s.d)}</td><td>${s.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}${s.lay?' <span class="tag w">Apartado #'+s.lay+'</span>':''}</td><td>${esc(nm('c',s.cl))}</td><td>${money(s.t)}</td><td>${s.st=='ok'?`<button onclick="editV(${s.id})">Editar</button> <button onclick="canV(${s.id})">Cancelar</button>`:'Cancelada'}</td></tr>`).join('')+'</table></div>'+layV()};
async function canV(i){const s=db.v.find(x=>x.id==i);if(!await ask('¿Cancelar la venta #'+i+'? Se regresan las piezas al stock.','Cancelar venta'))return;
 s.items.forEach(l=>adj(l,l.q));s.st='cancelada';db.m.push({id:id(),d:now(),ty:'cancel',a:-s.t});save();V.ven()}
function csv(){const r=[['Folio','Fecha','Hora','Producto','Cantidad','Precio','Subtotal','Estado']];
 db.v.filter(inR).forEach(s=>{const d=new Date(s.d);s.items.forEach(i=>r.push([s.id,ymd(s.d),d.toLocaleTimeString('es-MX'),i.n,i.q,i.pr,i.q*i.pr,s.st=='ok'?(s.lay?'Pagada (apartado #'+s.lay+')':'Pagada'):'Cancelada']))});
 down('ventas_'+per+'_'+fd+'.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

 $('main').innerHTML=`<div class="box"><p class="m">${lc?'Último corte: '+fh(lc.d):'Aún no hay cortes. Se cuenta todo lo registrado.'}</p>
 <table><tr><td>Ventas</td><td>${money(sm('venta'))}</td></tr><tr><td>Abonos de apartados</td><td>${money(sm('abono'))}</td></tr><tr><td>Devoluciones, cancelaciones y ajustes</td><td>${money(sm('cancel')+sm('ajuste'))}</td></tr></table>

 <h3>Cortes anteriores</h3><div class="wrap"><table><tr><th>Fecha</th><th>Esperado</th><th>Contado</th><th>Diferencia</th><th></th></tr>${[...db.k].reverse().map(k=>`<tr><td>${fh(k.d)}</td><td>${money(k.e)}</td><td>${money(k.c)}</td><td>${money(k.df)}</td><td><button onclick="editK(${k.id})">Editar</button></td></tr>`).join('')}</table></div>`;cc()};

const itF=it=>[...it.map(x=>({l:x.n+' · cantidad (0 = quitar)',t:'number',v:x.q})),...it.map(x=>({l:x.n+' · precio',t:'number',v:x.pr}))];
const newQ=(it,r,o)=>it.map((x,k)=>Math.max(0,Math.floor(+r[o+k])||0));
const newT=(it,r,o)=>it.reduce((a,x,k)=>a+newQ(it,r,o)[k]*(+r[o+it.length+k]||0),0);
const stockOk=(it,r,o)=>newQ(it,r,o).every((q,k)=>{const d=q-it[k].q;return d<=0||(it[k].c||[{id:it[k].id,q:it[k].u||1}]).every(x=>{const p=P(x.id);return !p||p.sk>=d*x.q})});
function setItems(x,r,o){const n=x.items.length,q=newQ(x.items,r,o);x.items.forEach((l,k)=>{adj(l,l.q-q[k]);l.pr=+r[o+n+k]||0;l.q=q[k]});x.items=x.items.filter(l=>l.q>0);x.t=x.items.reduce((a,l)=>a+l.q*l.pr,0)}
async function editV(i){const s=db.v.find(x=>x.id==i),r=await form('Editar venta #'+i,[{l:'Fecha y hora',t:'datetime-local',v:new Date(s.d).toLocaleString('sv').slice(0,16).replace(' ','T')},{l:'Cliente',o:opts('c',s.cl,'Sin cliente')},...itF(s.items)]);if(!r)return;
 if(!stockOk(s.items,r,2))return toast('No hay stock suficiente');
 if(!await ask('¿Guardar los cambios de la venta #'+i+'? El stock y la caja se ajustan solos.'))return;
 const old=s.t;setItems(s,r,2);s.cl=r[1];if(r[0])s.d=new Date(r[0]).toISOString();if(!s.items.length)s.st='cancelada';
 if(!s.lay&&s.t!=old)db.m.push({id:id(),d:now(),ty:'ajuste',a:s.t-old});save();V.ven();toast('Venta actualizada')}
async function editA(i){const a=db.a.find(x=>x.id==i),r=await form('Editar apartado #'+i,[{l:'Cliente',o:opts('c',a.cl,'—')},{l:'Total abonado',t:'number',v:a.pd},...itF(a.items)]);if(!r)return;
 if(!r[0])return toast('Elige un cliente');if(!stockOk(a.items,r,2))return toast('No hay stock suficiente');if((+r[1]||0)>newT(a.items,r,2))return toast('Lo abonado supera el total');
 if(!await ask('¿Guardar los cambios del apartado #'+i+'?'))return;
 const old=a.pd;setItems(a,r,2);a.cl=r[0];a.pd=+r[1]||0;if(a.pd!=old)db.m.push({id:id(),d:now(),ty:'ajuste',a:a.pd-old});save();V.apa();toast('Apartado actualizado')}
async function editK(i){const k=db.k.find(x=>x.id==i),r=await form('Editar corte',[{l:'Fondo inicial',t:'number',v:k.f},{l:'Efectivo contado',t:'number',v:k.c}]);if(!r||!await ask('¿Guardar los cambios del corte?'))return;
 k.e+=(+r[0]||0)-k.f;k.f=+r[0]||0;k.c=+r[1]||0;k.df=k.c-k.e;save();V.cor()}

function layV(){const A=db.a.filter(a=>inR(a)||db.v.some(s=>s.lay==a.id&&inR(s))),ab=db.m.filter(m=>m.ty=='abono'&&inR(m)).reduce((a,m)=>a+m.a,0);
 return `<h3>Apartados del periodo</h3><p class="m">Abonos cobrados en el periodo: <b>${money(ab)}</b>. Al entregar un apartado se registra arriba como venta.</p><div class="wrap"><table><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Abonado</th><th>Resta</th><th>Estado</th></tr>${[...A].reverse().map(a=>`<tr><td>${a.id}</td><td>${fh(a.d)}</td><td>${esc(nm('c',a.cl))}</td><td>${a.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</td><td>${money(a.t)}</td><td>${money(a.pd)}</td><td>${money(a.t-a.pd)}</td><td><span class="tag ${a.st=='abierto'?'w':a.st=='liquidado'?'':'no'}">${a.st=='liquidado'?'Entregado':a.st}</span></td></tr>`).join('')||'<tr><td colspan="8" class="m">Sin apartados en este periodo</td></tr>'}</table></div>`}
function bT(){$('#bt').innerHTML='<table><tr><th>Combo</th><th>Contiene</th><th>Precio</th><th>Disponibles</th><th></th></tr>'+(db.b.map(b=>`<tr><td>${esc(b.n)}</td><td>${b.items.map(x=>x.q+'× '+esc(nm('p',x.id))).join(', ')}</td><td>${money(b.pr)}</td><td><span class="tag ${bOk(b)?'':'no'}">${bOk(b)?bAv(b):'Agotado'}</span></td><td style="white-space:nowrap"><button onclick="editB(${b.id})">Editar</button> <button onclick="delB(${b.id})">${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="5" class="m">Aún no hay combos. Crea uno con "Nuevo combo".</td></tr>')+'</table>'}
const brow=x=>`<div class="ln2"><select>${opts('p',x.id,'Producto')}</select><input type="number" min="1" value="${x.q}"><button onclick="this.parentNode.remove()" title="Quitar">${ic('x')}</button></div>`;
async function editB(i){const b=i?B(i):{n:'',pr:'',items:[{id:'',q:1}]};
 const r=await modal(`<h3>${i?'Editar':'Nuevo'} combo</h3><label>Nombre<input id="bn" value="${esc(b.n)}" placeholder="Ej. 5 hojas, Kit escolar"></label><label>Precio del combo<input id="bp" type="number" min="0" value="${b.pr}"></label><label>Contiene (producto y cantidad)</label><div id="bi">${b.items.map(brow).join('')}</div><div class="row"><button onclick="$('#bi').insertAdjacentHTML('beforeend',brow({id:'',q:1}))">+ Agregar producto</button></div><div class="row"><button onclick="_o.close(null)">Cancelar</button><button class="pri" onclick="_o.close({n:$('#bn').value.trim(),pr:+$('#bp').value,it:[...document.querySelectorAll('#bi .ln2')].map(d=>({id:+d.querySelector('select').value,q:Math.floor(+d.querySelector('input').value)}))})">Guardar</button></div>`);
 if(!r)return;const m={};r.it.filter(x=>x.id&&x.q>0).forEach(x=>m[x.id]=(m[x.id]||0)+x.q);const it=Object.entries(m).map(([id,q])=>({id:+id,q}));
 if(!r.n||!(r.pr>0)||!it.length)return toast('Falta el nombre, el precio o los productos');

const nz=c=>String(c||'').trim().replace(/^0+/,''),byCode=c=>c&&db.p.find(p=>p.cd&&nz(p.cd)==nz(c));
const LT=['3211','2221','2122','1411','1132','1231','1114','1312','1213','3112'],GT=['1123','1222','2212','1141','2311','1321','4111','2131','3121','2113'],PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function tryD(r,d0){for(const N of[6,4]){const L=8+8*N+3-3+3,M=14*N+11;
 for(let i=d0?0:1;i+L<=r.length;i+=2){const a=r.slice(i,i+L);let t=0;for(const x of a)t+=x;const u=t/M;if(u<1.2)continue;
  const g=(k)=>a[k]>.5*u&&a[k]<1.9*u,c=3+4*N;if(!(g(0)&&g(1)&&g(2)&&g(c)&&g(c+1)&&g(c+2)&&g(c+3)&&g(c+4)&&g(L-3)&&g(L-2)&&g(L-1)))continue;
  const key=o=>{const q=a.slice(o,o+4),s=q[0]+q[1]+q[2]+q[3],k=q.map(x=>Math.max(1,Math.min(4,Math.round(x*7/s))));return k[0]+k[1]+k[2]+k[3]==7?k.join(''):''};
  let d=[],par='',ok=1;
  for(let j=0;j<N&&ok;j++){const k=key(3+4*j),l=LT.indexOf(k),gg=GT.indexOf(k);if(l>=0&&!(N==6&&gg>=0&&0)){d.push(l);par+='L'}else if(gg>=0&&N==6){d.push(gg);par+='G'}else ok=0}
  for(let j=0;j<N&&ok;j++){const l=LT.indexOf(key(c+5+4*j));if(l>=0)d.push(l);else ok=0}
  if(!ok)continue;
  if(N==6){const f=PAR.indexOf(par);if(f<0)continue;d.unshift(f)}
  const n=d.length-1;let sm=0;for(let j=0;j<n;j++)sm+=d[j]*((N==6?j%2:(j+1)%2)?3:1);
  if((10-sm%10)%10==d[n])return d.join('')}}return null}
function ean(g){const n=g.length,P=new Float32Array(n+1);for(let i=0;i<n;i++)P[i+1]=P[i]+g[i];
 const r=[];let cur=-1,len=0,f=0;for(let i=0;i<n;i++){const a=Math.max(0,i-24),b=Math.min(n,i+25),bit=g[i]<(P[b]-P[a])/(b-a)*.92?1:0;if(bit==cur)len++;else{if(cur>=0)r.push(len);else f=bit;cur=bit;len=1}}
 r.push(len);const lastDark=((r.length-1)%2==0)==(f==1);return tryD(r,f==1)||tryD(r.slice().reverse(),lastDark)}
function readEAN(v,cv,cx){const W=Math.min(v.videoWidth,800),H=Math.round(v.videoHeight*W/v.videoWidth);cv.width=W;cv.height=H;cx.drawImage(v,0,0,W,H);
 for(let k=0;k<9;k++){const y=Math.round(H*(.35+.3*k/8)),d=cx.getImageData(0,y,W,1).data,g=new Float32Array(W);
  for(let x=0;x<W;x++)g[x]=d[x*4]*.3+d[x*4+1]*.59+d[x*4+2]*.11;const c=ean(g);if(c)return c}return null}
